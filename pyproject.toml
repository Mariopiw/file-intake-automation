[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-intake-automation"
version = "1.0.0"
description = "A simple Python automation that organizes incoming files by type."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Your Name"}
]

[project.scripts]
file-organizer = "file_organizer.organizer:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
