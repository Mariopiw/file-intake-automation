[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-intake-automation"
version = "0.2.0"
description = "Preview and safely organize a trusted local file inbox"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mariusz Piwowarczyk"}]
dependencies = []

[project.scripts]
file-organizer = "file_organizer.organizer:main"

[tool.setuptools.packages.find]
include = ["file_organizer*"]
